<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Glow Halal">
  <defs>
    <!-- Metallic gold: highlight through the middle, deeper at both ends.
         Same ramp as the wordmark component so tab icon and header logo match. -->
    <linearGradient id="fav-gold" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#B8974E"/>
      <stop offset="24%"  stop-color="#D9BC72"/>
      <stop offset="48%"  stop-color="#EFD89A"/>
      <stop offset="66%"  stop-color="#D2B266"/>
      <stop offset="84%"  stop-color="#E0C67F"/>
      <stop offset="100%" stop-color="#A8863F"/>
    </linearGradient>
  </defs>

  <!-- Deep near-black tile (#121212 — the brand's fixed dark surface). Keeps the
       gold legible in a light browser tab, where a bare gold glyph would wash out. -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#121212"/>

  <!-- Serif "G" monogram in the brand gold. -->
  <text x="50" y="50" dy="0.34em" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="70" font-weight="600" fill="url(#fav-gold)">G</text>

  <!-- Sparkle burst, top-right, echoing the mark over the O in the wordmark. -->
  <g stroke="url(#fav-gold)" stroke-width="4" stroke-linecap="round">
    <line x1="72" y1="20" x2="72" y2="30"/>
    <line x1="83" y1="24" x2="78" y2="32"/>
    <line x1="61" y1="24" x2="66" y2="32"/>
  </g>
</svg>
